<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wang Qingsong final website logo</title>
  <desc id="desc">Final horizontal Wang Qingsong logo with a cinnabar square eye mark and vertically aligned bilingual wordmark.</desc>

  <g id="seal-mark">
    <rect x="0" y="75" width="150" height="150" rx="8" fill="#8E1B13"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M23 98H127V202H23V98ZM35 110V190H115V110H35Z" fill="#F4E0BC"/>
    <path d="M39 150C56 127 94 125 112 150C94 174 56 176 39 150Z" fill="#F4E0BC"/>
    <path d="M56 150C68 136 87 136 99 150C87 164 68 164 56 150Z" fill="#D96622"/>
    <circle cx="76" cy="150" r="15" fill="#8E1B13"/>
  </g>

  <g id="wordmark">
    <text x="183" y="136" fill="#201C18" font-family="'Songti SC', 'Noto Serif CJK SC', serif" font-size="76" font-weight="500" letter-spacing="11">王庆松</text>
    <text x="187" y="223" fill="#514A43" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic" letter-spacing="2.6">Wang Qingsong</text>
  </g>
</svg>
